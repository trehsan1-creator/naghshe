# SurveyPro -- surveying / GIS / CAD / civil platform
#
#   docker compose up --build          # PostGIS + API (migrated) + web UI
#   open http://localhost:5173         # nginx-served SPA, /api proxied to FastAPI
#   open http://localhost:8000/docs    # OpenAPI / Swagger
#
# The database is PostGIS-enabled: geometry columns are real `geometry(PointZ, <srid>)`
# and spatial filters run inside PostgreSQL.  Set SURVEYPRO_DATABASE_URL to a SQLite
# URL to run without the container (see backend/README notes in the root README).

name: surveypro

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: surveypro-db
    environment:
      POSTGRES_DB: surveypro
      POSTGRES_USER: surveypro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surveypro}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surveypro -d surveypro"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: surveypro-api
    environment:
      SURVEYPRO_DATABASE_URL: postgresql+asyncpg://surveypro:${POSTGRES_PASSWORD:-surveypro}@db:5432/surveypro
      SURVEYPRO_ENVIRONMENT: production
      SURVEYPRO_DEBUG: "false"
      SURVEYPRO_UPLOAD_DIR: /app/data/uploads
      SURVEYPRO_SAMPLE_DATA_DIR: /sample_data
      SURVEYPRO_CORS_ORIGINS: "*"
    volumes:
      - uploads:/app/data/uploads
      - derived:/app/data/derived
      - ./sample_data:/sample_data:ro
    command: >
      sh -lc "alembic upgrade head &&
              uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: surveypro-web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  derived:
